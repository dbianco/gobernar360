[project]
name = "gobernar360"
version = "0.1.0"
description = "Workspace of management dashboards for local governments"
authors = [
    { name = "Daniel", email = "spamolivab@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.164.0",
    "httpx2>=2.16.2",
    "nh3>=0.3",
    "fpdf2>=2.8.9",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gobernar360 = "gobernar360.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mutmut>=3.8",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
# Demo data for development and end-to-end tests: its mutants are literal names and
# amounts that no test should pin down. tests/test_seed.py still runs all of it.
do_not_mutate = ["src/gobernar360/seed.py"]
# What the tests need next to the code: the schema they migrate to.
also_copy = ["alembic.ini", "migrations", ".importlinter"]
pytest_add_cli_args = [
    "-p", "no:cacheprovider",
    # Runs lint-imports through uv, which would build a new environment in mutants/.
    "--deselect", "tests/test_architecture.py::test_dashboard_modules_do_not_import_each_other",
]

[tool.coverage.run]
source = ["gobernar360"]
branch = true

[tool.coverage.report]
# `uv run pytest --cov` fails below this.
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# mutmut's working copy (also in .gitignore, which ruff only reads inside a git checkout).
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as call expressions in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Cookie",
    "gobernar360.platform.access.require_dashboard",
]
