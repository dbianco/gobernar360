services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: gobernar360
      POSTGRES_PASSWORD: gobernar360
      POSTGRES_DB: gobernar360
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobernar360 -d gobernar360"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
